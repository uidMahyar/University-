<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برنامه هفتگی</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12233f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="برنامه من">
<style>
:root{--bg:#eef2f4;--card:#fff;--tx:#12233f;--mut:#566883;--line:#d3dde5;--hd:#12233f;--ac:#0f766e;--nl:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#0b1523;--card:#12223a;--tx:#e7eef8;--mut:#92a5c0;--line:#223756;--hd:#0a1220;--ac:#5eead4}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:system-ui,"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 20px}
.top{display:flex;justify-content:space-between;align-items:center;color:#b6c4dc}
h1{font-size:14px;font-weight:600}
#ins{border:1px solid #5eead4;color:#5eead4;background:none;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px}
.nt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:16px}
.nt b{display:block;font-size:21px;line-height:1.45}
.nt span{display:block;font-size:13px;color:#b6c4dc}
.cd{text-align:left;flex:none}
.cd strong{display:block;font-size:34px;line-height:1.1;color:#5eead4}
.plate{display:flex;gap:14px;margin-top:16px;padding:12px 16px;border-radius:18px;background:#5eead4;color:#0a1220}
.rm{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:16px;border-left:2px solid rgba(10,18,32,.28);font-size:40px;font-weight:800;line-height:1}
.rm small{font-size:12px;font-weight:700;margin-bottom:4px}
.bn{display:flex;align-items:center;font-size:22px;font-weight:800;line-height:1.35}
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none}
.days[hidden]{display:none}
.d{flex:none;position:relative;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:14px}
.d.has{color:var(--tx);font-weight:600}
.d.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.d.today:after{content:"";position:absolute;top:5px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--nl)}
main{padding:14px 16px 0}
.tl{position:relative}
.hr{position:absolute;right:0;left:0;border-top:1px solid var(--line)}
.hr span{position:absolute;right:0;top:-9px;width:30px;text-align:center;font-size:12px;color:var(--mut);background:var(--bg)}
.blk{position:absolute;right:40px;left:0;overflow:hidden;padding:10px 14px 10px 12px;border-radius:14px;border-right:5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.blk em{font-style:normal;font-size:12px;font-weight:700}
.blk h3{font-size:15px;line-height:1.5;margin:2px 0}
.blk p{font-size:12.5px;color:var(--mut)}
.pen{position:absolute;left:10px;top:8px;font-style:normal;font-size:14px;color:var(--mut)}
.loc{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:4px 11px;border-radius:10px;background:var(--tx);color:var(--bg);font-size:13px}
.loc b{font-size:15px}
.blk.sm{padding:6px 12px}.blk.sm em,.blk.sm p{display:none}.blk.sm .loc{margin-top:2px}
.nl{position:absolute;right:36px;left:0;height:2px;background:var(--nl)}
.nl:before{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--nl)}
.empty{position:absolute;right:40px;left:0;top:0;bottom:0;display:grid;place-items:center;color:var(--mut)}
.ft{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
.wr{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);font:inherit}
.wr.tdy{border:2px solid var(--ac)}
.wr>b{flex:none;width:62px;text-align:right;font-size:14px}
.bar{position:relative;flex:1;height:46px;border-radius:10px;background:var(--bg)}
.bar span{position:absolute;top:0;bottom:0;display:grid;align-content:center;grid-template-columns:minmax(0,1fr);text-align:center;font-size:12px;line-height:1.3;color:#fff;background:var(--c);border:2px solid var(--card);border-radius:10px}
.bar span b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}
.bar small{font-size:10.5px;opacity:.9}
.bar i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mut)}
.rs{display:block;margin:14px auto 0;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline}
nav{position:fixed;right:0;left:0;bottom:0;display:flex;gap:8px;padding:6px 16px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px;border:0;border-radius:12px;background:none;color:var(--mut);font:inherit;font-size:15px;font-weight:600}
nav .on{background:var(--bg);color:var(--tx)}
#add{position:fixed;left:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;background:var(--tx);color:var(--bg);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#ov,#ov2{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;background:rgba(5,12,24,.55)}
#ov[hidden],#ov2[hidden]{display:none}
.sh{width:100%;max-height:92vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--card);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.sh h2{font-size:17px}
#x,#x2{width:36px;height:36px;border:0;border-radius:50%;background:var(--bg);color:var(--tx);font-size:16px}
.sh label{display:block;margin-top:12px;font-size:12.5px;color:var(--mut)}
.sh input,.sh select{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#sw{display:flex;gap:10px;margin-top:14px}
#sw button{width:34px;height:34px;border:3px solid var(--card);border-radius:50%;background:var(--c)}
#sw .on{box-shadow:0 0 0 2px var(--tx)}
.sh .ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:13px}
.sh .ck[hidden]{display:none}
.sh .ck input{width:auto;margin:0}
#er,#er2{min-height:18px;margin-top:10px;color:var(--nl);font-size:13px}
.ac{display:flex;gap:10px;margin-top:6px}
.ac button{flex:1;padding:13px;border:0;border-radius:14px;font:inherit;font-size:15px;font-weight:700}
#sv,#sv2{background:var(--tx);color:var(--bg)}
#dl,#dl2{flex:none;border:1px solid var(--nl);background:none;color:var(--nl)}
.sy{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sy>div{padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.sy small{display:block;font-size:12px;color:var(--mut)}
.sy strong{display:block;margin-top:4px;font-size:16px;line-height:1.4}
.or{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:8px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;text-align:right}
.or.past{opacity:.55}
.od{flex:none;width:62px;padding:6px 0;border-radius:12px;background:var(--bg);text-align:center}
.od small{display:block;font-size:11px;color:var(--mut)}
.od b{display:block;font-size:22px;line-height:1.3}
.oi{flex:1;min-width:0}
.oi h3{font-size:15px}
.oi p{margin-top:3px;font-size:12.5px;color:var(--mut)}
.pr{flex:none;text-align:center}
.pr strong{display:block;font-size:20px}
.pr small{font-size:11px;color:var(--mut)}
.sec{margin:16px 2px 8px;font-size:13px;color:var(--mut)}
.none{padding:30px 10px;text-align:center;color:var(--mut)}
.nc{color:#b45309}
@media(prefers-color-scheme:dark){.nc{color:#fbbf24}}
.rule{margin-top:6px;font-size:12.5px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal b{text-align:center;font-size:12px;color:var(--mut)}
.cal button{position:relative;display:grid;place-content:center;aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;font-weight:700}
.cal small{font-size:9.5px;font-weight:400;line-height:1;color:var(--mut)}
.cal button:disabled{opacity:.35}
.cal .cl:after{content:"";position:absolute;bottom:4px;left:calc(50% - 2.5px);width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cal .sl,.cal .sl:disabled{opacity:1;background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cal .sl small{color:var(--bg)}
.cal .sl:after{background:var(--bg)}
#pk{min-height:20px;margin-top:12px;font-size:14px;font-weight:700}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pp button{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit}
.pp strong{display:block;font-size:22px}
.pp small{font-size:12px;color:var(--mut)}
.pp .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pp .on small{color:var(--bg)}
</style>
</head>
<body>
<header>
 <div class="top"><h1 id="dt"></h1><button id="ins" hidden>نصب برنامه</button></div>
 <div id="h"></div>
</header>
<div class="days" id="days"></div>
<main id="list"></main>
<button id="add" aria-label="افزودن کلاس">+</button>
<nav><button data-v="day">روزانه</button><button data-v="week">هفتگی</button><button data-v="self">سلف</button></nav>
<div id="ov" hidden>
 <div class="sh" role="dialog" aria-modal="true">
  <div class="sh-h"><h2 id="st"></h2><button id="x" aria-label="بستن">✕</button></div>
  <label>نام درس<input id="f-n"></label>
  <label>استاد<input id="f-t"></label>
  <div class="g2"><label>روز<select id="f-d"></select></label><label>واحد<input id="f-u" type="number" step="0.5" min="0"></label></div>
  <div class="g2"><label>شروع<input id="f-s" type="time"></label><label>پایان<input id="f-e" type="time"></label></div>
  <div class="g2"><label>شماره کلاس<input id="f-r" inputmode="numeric"></label><label>ساختمان<input id="f-b" list="bl"></label></div>
  <datalist id="bl"><option value="ساختمان اسرار"><option value="ساختمان رضوان"><option value="ساختمان غدیر"></datalist>
  <div id="sw"></div>
  <label class="ck" id="ak"><input type="checkbox" id="f-a" checked>اعمال نام، استاد، واحد و رنگ روی همه‌ی جلسه‌های این درس</label>
  <p id="er"></p>
  <div class="ac"><button id="sv">ذخیره</button><button id="dl">حذف</button></div>
 </div>
</div>
<div id="ov2" hidden>
 <div class="sh" role="dialog" aria-modal="true">
  <div class="sh-h"><h2 id="st2"></h2><button id="x2" aria-label="بستن">✕</button></div>
  <p class="rule" id="ru"></p>
  <div class="cal" id="cal"></div>
  <p id="pk"></p>
  <label>نام غذا (اختیاری)<input id="g-n" placeholder="مثلاً چلو مرغ"></label>
  <div class="pp" id="pp"></div>
  <p id="er2"></p>
  <div class="ac"><button id="sv2">ثبت سفارش</button><button id="dl2">حذف</button></div>
 </div>
</div>
<script>
const $=i=>document.getElementById(i),F=k=>$("f-"+k),fa=x=>String(x).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
const K=["#1d4ed8","#b45309","#0f766e","#be123c","#6d28d9","#4d7c0f"],BL="ساختمان اسرار";
// برنامه‌ی اولیه: (روز از شنبه=۰، شروع، پایان، درس، استاد، کلاس، واحد، رنگ)
const X=(d,s,e,n,t,r,u,c)=>({d,s:s*60,e:e*60,n,t,r,b:BL,u,c});
const DEF=[X(0,8,12,"کاربینی (مدیریت مالی)","فرید آقاجانی","116",1,0),X(2,8,10,"مبانی سازمان و مدیریت (۱)","عطیه هوشیار","112",2,1),X(2,10,12,"مبانی سازمان و مدیریت (۱)","عطیه هوشیار","113",2,1),X(3,12,14,"ریاضیات و کاربرد آن در مدیریت (۱)","جواد آبسالان","116",2,2),X(4,12,14,"ریاضیات و کاربرد آن در مدیریت (۱)","جواد آبسالان","116",2,2),X(5,8,14,"اصول حسابداری (۱)","رضا واحدالعین","103",3,3)];
let data;try{data=JSON.parse(localStorage.getItem("sch2"))}catch(e){}
if(!Array.isArray(data))data=DEF.map(x=>({...x}));
const save=()=>{try{localStorage.setItem("sch2",JSON.stringify(data))}catch(e){}};
const P=72,L=d=>data.filter(x=>x.d==d).sort((a,b)=>a.s-b.s);
const tm=m=>fa(String(Math.floor(m/60)).padStart(2,"0"))+":"+fa(String(m%60).padStart(2,"0"));
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const mm=v=>{const p=v.split(":");return v&&p.length>1?+p[0]*60+ +p[1]:NaN};
const sh=n=>n.replace(/\(.*?\)|\s+و\s+.*/g,"").trim()||n;
const rng=()=>{let a=8,z=14;data.forEach(x=>{a=Math.min(a,Math.floor(x.s/60));z=Math.max(z,Math.ceil(x.e/60))});return[a,z]};
const now=()=>{const n=new Date();return{d:(n.getDay()+1)%7,m:n.getHours()*60+n.getMinutes()}};
const er=m=>{$("er").textContent=m};
let sel=now().d,view="day",ed=-1,ck=0;
function nxt(){const t=now();for(let i=0;i<=7;i++)for(const x of L((t.d+i)%7)){const a=i*1440+x.s-t.m,b=i*1440+x.e-t.m;if(b>0)return{x,a,b,i}}}
function hero(){const n=nxt();
 if(!n){$("h").innerHTML=`<div class="nt"><div><b>کلاسی ثبت نشده</b><span>با دکمه‌ی + یک کلاس اضافه کن</span></div></div>`;return}
 const x=n.x,live=n.a<=0,cd=live?[tm(n.b),"مانده تا پایان"]:n.i?[n.i==1?"فردا":D[(now().d+n.i)%7],"ساعت "+tm(x.s)]:[tm(n.a),"مانده تا شروع"];
 $("h").innerHTML=`<div class="nt"><div><span>${live?"در حال برگزاری":"کلاس بعدی"}</span><b>${E(x.n)}</b></div><div class="cd"><strong>${cd[0]}</strong><span>${cd[1]}</span></div></div><div class="plate"><div class="rm"><small>کلاس</small>${E(fa(x.r||"—"))}</div><div class="bn">${E(x.b||"—")}</div></div>`}
function day(){const t=now(),l=L(sel),[A,Z]=rng();let g="";
 for(let h=A;h<=Z;h++)g+=`<div class="hr" style="top:${(h-A)*P}px"><span>${fa(h)}</span></div>`;
 g+=l.map(x=>`<div class="blk${x.e-x.s<75?" sm":""}" data-id="${data.indexOf(x)}" style="--c:${K[x.c]};top:${(x.s/60-A)*P+3}px;height:${(x.e-x.s)/60*P-6}px"><i class="pen">✎</i><em>${tm(x.s)} تا ${tm(x.e)}</em><h3>${E(x.n)}</h3><p>${E(x.t)}</p><div class="loc"><b>کلاس ${E(fa(x.r||"—"))}</b><span>${E(x.b)}</span></div></div>`).join("");
 if(!l.length)g+=`<p class="empty">این روز کلاسی نداری</p>`;
 if(sel==t.d&&t.m>=A*60&&t.m<=Z*60)g+=`<div class="nl" style="top:${(t.m/60-A)*P}px"></div>`;
 return `<div class="tl" style="height:${(Z-A)*P}px">${g}</div><small class="ft">برای ویرایش روی هر کلاس بزن</small>`}
function week(){const[A,Z]=rng();
 return D.map((n,i)=>`<button class="wr${i==now().d?" tdy":""}" data-i="${i}"><b>${n}</b><div class="bar">${L(i).length?"":"<i>بدون کلاس</i>"}${L(i).map(x=>`<span style="--c:${K[x.c]};right:${(x.s/60-A)/(Z-A)*100}%;width:${(x.e-x.s)/60/(Z-A)*100}%"><b>${E(sh(x.n))}</b><small>${tm(x.s)}</small></span>`).join("")}</div></button>`).join("")+`<button class="rs" id="rs">بازگردانی برنامه‌ی اولیه</button>`}
function paint(){document.querySelectorAll(".d").forEach((b,i)=>{b.classList.toggle("on",i==sel);b.classList.toggle("has",L(i).length>0)});
 $("days").hidden=view!="day";$("list").innerHTML=view=="day"?day():view=="week"?week():slf();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==view))}
const swt=()=>{$("sw").innerHTML=K.map((c,i)=>`<button style="--c:${c}" class="${i==ck?"on":""}" data-c="${i}" aria-label="رنگ ${fa(i+1)}"></button>`).join("")};
function openEd(i){ed=i;const x=i<0?{d:sel,s:480,e:600,n:"",t:"",r:"",b:BL,u:2,c:0}:data[i];
 $("st").textContent=i<0?"کلاس جدید":"ویرایش کلاس";
 F("n").value=x.n;F("t").value=x.t;F("d").value=x.d;F("u").value=x.u;F("s").value=hm(x.s);F("e").value=hm(x.e);F("r").value=x.r;F("b").value=x.b;F("a").checked=true;
 er("");$("dl").hidden=i<0;$("ak").hidden=i<0;ck=x.c;swt();$("ov").hidden=false}
F("d").innerHTML=D.map((n,i)=>`<option value="${i}">${n}</option>`).join("");
$("sw").onclick=e=>{const b=e.target.closest("button");if(b){ck=+b.dataset.c;swt()}};
$("x").onclick=()=>{$("ov").hidden=true};
$("ov").onclick=e=>{if(e.target==$("ov"))$("ov").hidden=true};
$("add").onclick=()=>view=="self"?openOr(-1):openEd(-1);
$("sv").onclick=()=>{const s=mm(F("s").value),e=mm(F("e").value),n=F("n").value.trim();
 if(!n)return er("نام درس رو وارد کن");
 if(!(e>s))return er("ساعت پایان باید بعد از شروع باشه");
 const v={d:+F("d").value,s,e,n,t:F("t").value.trim(),r:F("r").value.trim(),b:F("b").value.trim(),u:+F("u").value||0,c:ck};
 if(ed<0)data.push(v);else{const o=data[ed],on=o.n;if(F("a").checked)data.forEach(x=>{if(x.n==on)Object.assign(x,{n:v.n,t:v.t,u:v.u,c:v.c})});Object.assign(o,v)}
 sel=v.d;save();$("ov").hidden=true;hero();paint()};
$("dl").onclick=()=>{if(confirm("این کلاس حذف شود؟")){data.splice(ed,1);save();$("ov").hidden=true;hero();paint()}};
$("dt").textContent=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
$("days").innerHTML=D.map((n,i)=>`<button class="d${i==now().d?" today":""}" data-i="${i}">${n}</button>`).join("");
$("days").onclick=e=>{const b=e.target.closest(".d");if(b){sel=+b.dataset.i;paint()}};
$("list").onclick=e=>{const w=e.target.closest(".wr"),b=e.target.closest(".blk"),o=e.target.closest(".or");
 if(w){sel=+w.dataset.i;view="day";paint();scrollTo(0,0)}
 else if(b)openEd(+b.dataset.id);
 else if(o)openOr(+o.dataset.o);
 else if(e.target.id=="rs"&&confirm("برنامه به حالت اولیه برگردد؟ تغییرهای تو پاک می‌شود.")){data=DEF.map(x=>({...x}));save();hero();paint()}};
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;paint()}};
// ---- سلف: سفارش غذا (حداقل ۴۸ ساعت قبل از روز غذا؛ ساعت غذا = MEAL) ----
const U="هزار تومان",MEAL=12,H48=48*36e5;
let ords;try{ords=JSON.parse(localStorage.getItem("sch2o"))}catch(e){}
if(!Array.isArray(ords))ords=[];
const saveO=()=>{try{localStorage.setItem("sch2o",JSON.stringify(ords))}catch(e){}};
const jf=(d,o)=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",o).format(d);
const jl=d=>jf(d,{weekday:"long",day:"numeric",month:"long"});
const jn=d=>+new Intl.DateTimeFormat("en-u-ca-persian",{day:"numeric"}).format(d);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dd=s=>{const p=s.split("-");return new Date(+p[0],p[1]-1,+p[2],MEAL)};
const pd=d=>(d.getDay()+1)%7,okD=d=>d.getTime()>=Date.now()+H48;
const firstOk=()=>{const d=new Date();d.setHours(MEAL,0,0,0);while(!okD(d))d.setDate(d.getDate()+1);return d};
let eo=-1,sd=null,pr=100;
function slf(){const T=iso(new Date()),ix=ords.map((o,i)=>({...o,i})),up=ix.filter(o=>o.d>=T).sort((a,b)=>a.d<b.d?-1:1),ps=ix.filter(o=>o.d<T).sort((a,b)=>a.d<b.d?1:-1);
 const row=o=>{const d=dd(o.d),n=Math.round((d-dd(T))/864e5),c=L(pd(d)).length;
  return `<button class="or${o.d<T?" past":""}" data-o="${o.i}"><div class="od"><small>${jf(d,{weekday:"long"})}</small><b>${fa(jn(d))}</b><small>${jf(d,{month:"long"})}</small></div><div class="oi"><h3>${o.n?E(o.n):"بدون نام غذا"}</h3><p${c?"":' class="nc"'}>${n==0?"امروز":n==1?"فردا":n>0?fa(n)+" روز دیگر":fa(-n)+" روز پیش"} · ${c?"کلاس داری":"کلاسی نداری"}</p></div><div class="pr"><strong>${fa(o.p)}</strong><small>${U}</small></div></button>`};
 return `<div class="sy"><div><small>زودترین روز قابل سفارش</small><strong>${jl(firstOk())}</strong></div><div><small>جمع سفارش‌های پیش‌رو</small><strong>${fa(up.reduce((a,o)=>a+o.p,0))} ${U}</strong></div></div>`
  +(ords.length?up.map(row).join("")+(ps.length?`<h4 class="sec">گذشته</h4>`+ps.map(row).join(""):""):`<p class="none">هنوز سفارشی ثبت نکردی. با دکمه‌ی + اولین سفارش را بزن.</p>`)
  +`<small class="ft">سفارش باید حداقل ۴۸ ساعت قبل از روز غذا ثبت شود</small>`}
function cal(){const s0=new Date();s0.setHours(MEAL,0,0,0);s0.setDate(s0.getDate()-pd(s0));
 let h=["ش","ی","د","س","چ","پ","ج"].map(x=>`<b>${x}</b>`).join("");
 for(let i=0;i<35;i++){const d=new Date(s0);d.setDate(s0.getDate()+i);const k=iso(d),tk=ords.some((r,j)=>r.d==k&&j!=eo);
  h+=`<button data-k="${k}" class="${L(pd(d)).length?"cl ":""}${k==sd?"sl":""}"${okD(d)&&!tk?"":" disabled"}>${fa(jn(d))}<small>${tk?"✓":i==0||jn(d)==1?jf(d,{month:"long"}):""}</small></button>`}
 $("cal").innerHTML=h;const c=sd&&dd(sd);
 $("pk").innerHTML=c?jl(c)+(L(pd(c)).length?"":` <span class="nc">· آن روز کلاسی نداری</span>`):"یک روز انتخاب کن"}
const pps=()=>{$("pp").innerHTML=[100,150].map(v=>`<button data-p="${v}"${v==pr?' class="on"':""}><strong>${fa(v)}</strong><small>${U}</small></button>`).join("")};
function openOr(i){eo=i;const o=i<0?{d:null,n:"",p:pr}:ords[i];sd=o.d;pr=o.p;
 $("st2").textContent=i<0?"سفارش غذای سلف":"ویرایش سفارش";
 $("ru").textContent="حداقل ۴۸ ساعت قبل از روز غذا · زودترین روز: "+jl(firstOk());
 $("g-n").value=o.n;$("er2").textContent="";$("dl2").hidden=i<0;cal();pps();$("ov2").hidden=false}
$("cal").onclick=e=>{const b=e.target.closest("button");if(b&&!b.disabled){sd=b.dataset.k;cal()}};
$("pp").onclick=e=>{const b=e.target.closest("button");if(b){pr=+b.dataset.p;pps()}};
$("x2").onclick=()=>{$("ov2").hidden=true};
$("ov2").onclick=e=>{if(e.target==$("ov2"))$("ov2").hidden=true};
$("sv2").onclick=()=>{const m=t=>{$("er2").textContent=t},o=ords[eo];
 if(!sd)return m("یک روز انتخاب کن");
 if((eo<0||o.d!=sd)&&!okD(dd(sd)))return m("سفارش باید حداقل ۴۸ ساعت قبل از روز غذا باشد");
 const v={d:sd,n:$("g-n").value.trim(),p:pr};
 if(eo<0)ords.push(v);else ords[eo]=v;
 saveO();$("ov2").hidden=true;paint()};
$("dl2").onclick=()=>{if(confirm("این سفارش حذف شود؟")){ords.splice(eo,1);saveO();$("ov2").hidden=true;paint()}};
hero();paint();
document.querySelector(".d.on").scrollIntoView({inline:"center",block:"nearest"});
setInterval(()=>{hero();if(view=="day")$("list").innerHTML=day()},3e4);
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("ins").hidden=false});
$("ins").onclick=async()=>{dp.prompt();await dp.userChoice;$("ins").hidden=true};
addEventListener("appinstalled",()=>$("ins").hidden=true);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
