<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برنامه هفتگی</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12233f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="برنامه من">
<style>
:root{--bg:#eef2f4;--card:#fff;--tx:#12233f;--mut:#566883;--line:#d3dde5;--hd:#12233f;--ac:#0f766e;--nl:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#0b1523;--card:#12223a;--tx:#e7eef8;--mut:#92a5c0;--line:#223756;--hd:#0a1220;--ac:#5eead4}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:system-ui,"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 20px 22px}
.top{display:flex;justify-content:space-between;align-items:center;color:#b6c4dc}
h1{font-size:14px;font-weight:600}
#ins{border:1px solid #5eead4;color:#5eead4;background:none;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px}
.next{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:18px}
.next b{display:block;font-size:21px;line-height:1.45}
.next span{font-size:13px;color:#b6c4dc}
.cd{text-align:left;flex:none}
.cd strong{display:block;font-size:34px;line-height:1.1;color:#5eead4}
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none}
.days[hidden]{display:none}
.d{flex:none;position:relative;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:14px}
.d.has{color:var(--tx);font-weight:600}
.d.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.d.today:after{content:"";position:absolute;top:5px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--nl)}
main{padding:14px 16px 0}
.tl{position:relative}
.hr{position:absolute;right:0;left:0;border-top:1px solid var(--line)}
.hr span{position:absolute;right:0;top:-9px;width:30px;text-align:center;font-size:12px;color:var(--mut);background:var(--bg)}
.blk{position:absolute;right:40px;left:0;overflow:hidden;padding:10px 14px 10px 12px;border-radius:14px;border-right:5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.blk em{font-style:normal;font-size:12px;font-weight:700}
.blk h3{font-size:15px;line-height:1.5;margin:2px 0}
.blk p{font-size:12.5px;color:var(--mut)}
.nl{position:absolute;right:36px;left:0;height:2px;background:var(--nl)}
.nl:before{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--nl)}
.empty{position:absolute;right:40px;left:0;top:0;bottom:0;display:grid;place-items:center;color:var(--mut)}
.ft{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
.wr{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);font:inherit}
.wr.tdy{border:2px solid var(--ac)}
.wr b{flex:none;width:62px;text-align:right;font-size:14px}
.bar{position:relative;flex:1;height:46px;border-radius:10px;background:var(--bg)}
.bar span{position:absolute;top:0;bottom:0;display:grid;place-content:center;text-align:center;font-size:12px;font-weight:700;line-height:1.3;color:#fff;background:var(--c);border:2px solid var(--card);border-radius:10px}
.bar small{font-size:10.5px;font-weight:400;opacity:.9}
.bar i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mut)}
nav{position:fixed;right:0;left:0;bottom:0;display:flex;gap:8px;padding:6px 16px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px;border:0;border-radius:12px;background:none;color:var(--mut);font:inherit;font-size:15px;font-weight:600}
nav .on{background:var(--bg);color:var(--tx)}
</style>
</head>
<body>
<header>
 <div class="top"><h1 id="dt"></h1><button id="ins" hidden>نصب برنامه</button></div>
 <div class="next" id="h"></div>
</header>
<div class="days" id="days"></div>
<main id="list"></main>
<nav><button data-v="day">روزانه</button><button data-v="week">هفتگی</button></nav>
<script>
const $=i=>document.getElementById(i),fa=x=>String(x).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const D=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
// درس‌ها: [نام, واحد, رنگ, نام کوتاه]
const C={k:["کاربینی (مدیریت مالی)",1,"#1d4ed8","کاربینی"],m:["مبانی سازمان و مدیریت (۱)",2,"#b45309","سازمان"],r:["ریاضیات و کاربرد آن در مدیریت (۱)",2,"#0f766e","ریاضیات"],h:["اصول حسابداری (۱)",3,"#be123c","حسابداری"]};
// جلسات هر روز (از شنبه): [درس, شروع, پایان, استاد, کلاس]
const S=[[["k",8,12,"فرید آقاجانی","116"]],[],[["m",8,10,"عطیه هوشیار","112"],["m",10,12,"عطیه هوشیار","113"]],[["r",12,14,"جواد آبسالان","116"]],[["r",12,14,"جواد آبسالان","116"]],[["h",8,14,"رضا واحدالعین","103"]],[]];
const P=64,A=8,Z=14;
const hh=h=>fa(String(h).padStart(2,"0"))+":۰۰";
const clk=m=>fa(Math.floor(m/60))+":"+fa(String(m%60).padStart(2,"0"));
const now=()=>{const n=new Date();return{d:(n.getDay()+1)%7,m:n.getHours()*60+n.getMinutes()}};
let sel=now().d,view="day";
function nxt(){const t=now();for(let i=0;i<=7;i++)for(const x of S[(t.d+i)%7]){const a=i*1440+x[1]*60-t.m,b=i*1440+x[2]*60-t.m;if(b>0)return{x,a,b,i}}}
function hero(){const n=nxt(),c=C[n.x[0]],live=n.a<=0;
 const cd=live?[clk(n.b),"مانده تا پایان"]:n.i?[n.i==1?"فردا":D[(now().d+n.i)%7],"ساعت "+hh(n.x[1])]:[clk(n.a),"مانده تا شروع"];
 $("h").innerHTML=`<div><b>${c[0]}</b><span>${live?"در حال برگزاری":"کلاس بعدی"} · کلاس ${fa(n.x[4])}</span></div><div class="cd"><strong>${cd[0]}</strong><span>${cd[1]}</span></div>`}
function day(){const t=now(),L=S[sel];let g="";
 for(let h=A;h<=Z;h++)g+=`<div class="hr" style="top:${(h-A)*P}px"><span>${fa(h)}</span></div>`;
 g+=L.map(x=>{const c=C[x[0]];return `<div class="blk" style="--c:${c[2]};top:${(x[1]-A)*P+3}px;height:${(x[2]-x[1])*P-6}px"><em>${hh(x[1])} تا ${hh(x[2])}</em><h3>${c[0]}</h3><p>${x[3]}</p><p>کلاس ${fa(x[4])} · ${fa(c[1])} واحد</p></div>`}).join("");
 if(!L.length)g+=`<p class="empty">این روز کلاسی نداری</p>`;
 if(sel==t.d&&t.m>=A*60&&t.m<=Z*60)g+=`<div class="nl" style="top:${(t.m/60-A)*P}px"></div>`;
 return `<div class="tl" style="height:${(Z-A)*P}px">${g}</div><small class="ft">ساختمان اسرار · دانشگاه بین‌المللی امام رضا (ع)</small>`}
function week(){return S.map((L,i)=>`<button class="wr${i==now().d?" tdy":""}" data-i="${i}"><b>${D[i]}</b><div class="bar">${L.length?"":"<i>بدون کلاس</i>"}${L.map(x=>{const c=C[x[0]];return `<span style="--c:${c[2]};right:${(x[1]-A)/(Z-A)*100}%;width:${(x[2]-x[1])/(Z-A)*100}%">${c[3]}<small>${fa(x[1])}–${fa(x[2])}</small></span>`}).join("")}</div></button>`).join("")}
function paint(){document.querySelectorAll(".d").forEach((b,i)=>b.classList.toggle("on",i==sel));
 $("days").hidden=view!="day";$("list").innerHTML=view=="day"?day():week();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==view))}
$("dt").textContent=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
$("days").innerHTML=D.map((n,i)=>`<button class="d${S[i].length?" has":""}${i==now().d?" today":""}" data-i="${i}">${n}</button>`).join("");
$("days").onclick=e=>{const b=e.target.closest(".d");if(b){sel=+b.dataset.i;paint()}};
$("list").onclick=e=>{const b=e.target.closest(".wr");if(b){sel=+b.dataset.i;view="day";paint();scrollTo(0,0)}};
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;paint()}};
hero();paint();
document.querySelector(".d.on").scrollIntoView({inline:"center",block:"nearest"});
setInterval(()=>{hero();if(view=="day")$("list").innerHTML=day()},3e4);
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("ins").hidden=false});
$("ins").onclick=async()=>{dp.prompt();await dp.userChoice;$("ins").hidden=true};
addEventListener("appinstalled",()=>$("ins").hidden=true);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
