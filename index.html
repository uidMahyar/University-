<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برنامه هفتگی</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12233f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="برنامه من">
<style>
:root{--bg:#eef2f4;--card:#fff;--tx:#12233f;--mut:#566883;--line:#d3dde5;--hd:#12233f;--ac:#0f766e;--nl:#e11d48;--wn:#b45309}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1523;--card:#12223a;--tx:#e7eef8;--mut:#92a5c0;--line:#223756;--hd:#0a1220;--ac:#5eead4;--wn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0b1523;--card:#12223a;--tx:#e7eef8;--mut:#92a5c0;--line:#223756;--hd:#0a1220;--ac:#5eead4;--wn:#fbbf24}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom));font-family:system-ui,"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif;color:var(--tx);background:var(--bg)}
button{font:inherit;color:inherit}
header{padding:calc(env(safe-area-inset-top) + 16px) 20px 20px;background:var(--hd);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;color:#b6c4dc}
.top div{display:flex;gap:8px}
h1{font-size:14px;font-weight:600}
.hb{padding:5px 12px;border:1px solid #5eead4;border-radius:99px;background:none;color:#5eead4;font-size:13px}
.nt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:16px}
.nt b{display:block;font-size:21px;line-height:1.45}
.nt span{display:block;font-size:13px;color:#b6c4dc}
.cd{text-align:left;flex:none}
.cd strong{display:block;font-size:34px;line-height:1.1;color:#5eead4}
.plate{display:flex;gap:14px;margin-top:16px;padding:12px 16px;border-radius:18px;background:#5eead4;color:#0a1220}
.rm{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:16px;border-left:2px solid rgba(10,18,32,.28);font-size:40px;font-weight:800;line-height:1}
.rm small{margin-bottom:4px;font-size:12px;font-weight:700}
.bn{display:flex;align-items:center;font-size:22px;font-weight:800;line-height:1.35}
.pw{padding:14px 16px 0}
.pw[hidden],.days[hidden]{display:none}
.seg{display:flex;gap:4px;margin-top:6px;padding:4px;border-radius:14px;background:var(--bg)}
.pw .seg{margin:0;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:9px 6px;border:0;border-radius:10px;background:none;color:var(--mut);font-size:13.5px;font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
.d{flex:none;position:relative;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mut);font-size:14px}
.d.has{color:var(--tx);font-weight:600}
.d.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.d.today:after{content:"";position:absolute;top:5px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--nl)}
main{padding:14px 16px 0}
.tl{position:relative}
.hr{position:absolute;right:0;left:0;border-top:1px solid var(--line)}
.hr span{position:absolute;right:0;top:-9px;width:30px;text-align:center;font-size:12px;color:var(--mut);background:var(--bg)}
.blk{position:absolute;right:40px;left:0;overflow:hidden;padding:10px 14px 10px 12px;border-radius:14px;border-right:5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.blk em{font-style:normal;font-size:12px;font-weight:700}
.blk h3{margin:2px 0;font-size:15px;line-height:1.5}
.blk p{font-size:12.5px;color:var(--mut)}
.blk.ph{border:2px dashed var(--mut);border-right-width:5px;background:none}
.pen{position:absolute;left:10px;top:8px;font-style:normal;font-size:14px;color:var(--mut)}
.loc{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:4px 11px;border-radius:10px;background:var(--tx);color:var(--bg);font-size:13px}
.loc b{font-size:15px}
.blk.sm{padding:6px 12px}.blk.sm em,.blk.sm p{display:none}.blk.sm .loc{margin-top:2px}
.nl{position:absolute;right:36px;left:0;height:2px;background:var(--nl)}
.nl:before{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--nl)}
.empty{position:absolute;right:40px;left:0;top:0;bottom:0;display:grid;place-items:center;color:var(--mut)}
.ft{display:block;margin-top:18px;text-align:center;font-size:12px;color:var(--mut)}
.wr{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.wr.tdy{border:2px solid var(--ac)}
.wr>b{flex:none;width:62px;text-align:right;font-size:14px}
.bar{position:relative;flex:1;height:46px;border-radius:10px;background:var(--bg)}
.bar span{position:absolute;top:0;bottom:0;display:grid;align-content:center;grid-template-columns:minmax(0,1fr);text-align:center;font-size:12px;line-height:1.3;color:#fff;background:var(--c);border:2px solid var(--card);border-radius:10px}
.bar span.ph{border:2px dashed var(--mut);background:none;color:var(--mut)}
.bar span b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}
.bar small{font-size:10.5px;opacity:.9}
.bar i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mut)}
nav{position:fixed;right:0;left:0;bottom:0;max-width:560px;margin:0 auto;display:flex;gap:8px;padding:6px 16px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px;border:0;border-radius:12px;background:none;color:var(--mut);font-size:15px;font-weight:600}
nav .on{background:var(--bg);color:var(--tx)}
#add{position:fixed;left:max(18px,calc(50% - 262px));bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;background:var(--tx);color:var(--bg);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;background:rgba(5,12,24,.55)}
.ov[hidden]{display:none}
.ov.mid{z-index:20;align-items:center;justify-content:center;padding:20px}
.sh{width:100%;max-width:560px;max-height:92vh;margin:0 auto;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--card);animation:up .22s ease-out}
.dlg{width:100%;max-width:380px;padding:20px;border-radius:22px;background:var(--card);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.sh h2{font-size:17px}
.xb{width:36px;height:36px;border:0;border-radius:50%;background:var(--bg);font-size:16px}
.sh label,.lb{display:block;margin-top:12px;font-size:12.5px;color:var(--mut)}
.sh input:not([type=checkbox]),.tb{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;text-align:right}
.tb{text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chs button{padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:13.5px}
.gr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.gr button{padding:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.gr .on,.chs .on,.seg .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.stp{display:flex;align-items:center;justify-content:space-between;margin-top:5px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.stp button{width:38px;height:38px;border:0;border-radius:9px;background:var(--card);font-size:20px}
.stp b{font-size:16px}
#sw{display:flex;gap:10px;margin-top:14px}
#sw button{width:34px;height:34px;border:3px solid var(--card);border-radius:50%;background:var(--c)}
#sw .on{box-shadow:0 0 0 2px var(--tx)}
.sh .ck{position:relative;display:flex;align-items:center;gap:10px;color:var(--tx);font-size:13px}
.sh .ck[hidden]{display:none}
.ck input{position:absolute;opacity:0}
.ck i{flex:none;display:grid;place-items:center;width:22px;height:22px;border:2px solid var(--mut);border-radius:7px}
.ck input:checked+i{background:var(--tx);border-color:var(--tx)}
.ck input:checked+i:after{content:"";width:6px;height:11px;margin-top:-2px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
#er,#er2{min-height:18px;margin-top:10px;color:var(--nl);font-size:13px}
.ac{display:flex;gap:10px;margin-top:6px}
.ac button{flex:1;padding:13px;border:0;border-radius:14px;background:var(--bg);font-size:15px;font-weight:700}
#sv,#sv2,#tok,#cy{background:var(--tx);color:var(--bg)}
#cy.dg{background:var(--nl);color:#fff}
#dl,#dl2{flex:none;border:1px solid var(--nl);background:none;color:var(--nl)}
#cm{font-size:15px;line-height:1.9}
.tpv{margin-bottom:6px;text-align:center;font-size:42px;font-weight:800}
.row{display:block;width:100%;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);text-align:right;font-size:14.5px}
#sx{border-color:var(--nl);color:var(--nl)}
.sy{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sy>div{padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.sy small{display:block;font-size:12px;color:var(--mut)}
.sy strong{display:block;margin-top:4px;font-size:16px;line-height:1.4}
.or{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:8px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:right}
.or.past{opacity:.55}
.od{flex:none;width:62px;padding:6px 0;border-radius:12px;background:var(--bg);text-align:center}
.od small{display:block;font-size:11px;color:var(--mut)}
.od b{display:block;font-size:22px;line-height:1.3}
.oi{flex:1;min-width:0}
.oi h3{font-size:15px}
.oi p{margin-top:3px;font-size:12.5px;color:var(--mut)}
.pr{flex:none;text-align:center}
.pr strong{display:block;font-size:20px}
.pr small{font-size:11px;color:var(--mut)}
.sec{margin:16px 2px 8px;font-size:13px;color:var(--mut)}
.none{padding:30px 10px;text-align:center;color:var(--mut)}
p.nc,.nc{color:var(--wn)}
.rule{margin-top:6px;font-size:12.5px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal b{text-align:center;font-size:12px;color:var(--mut)}
.cal button{position:relative;display:grid;place-content:center;aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:15px;font-weight:700}
.cal small{font-size:9.5px;font-weight:400;line-height:1;color:var(--mut)}
.cal button:disabled{opacity:.35}
.cal .cl:after{content:"";position:absolute;bottom:4px;left:calc(50% - 2.5px);width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cal .sl,.cal .sl:disabled{opacity:1;background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cal .sl small{color:var(--bg)}
.cal .sl:after{background:var(--bg)}
#pk{min-height:20px;margin-top:12px;font-size:14px;font-weight:700}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pp button{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.pp strong{display:block;font-size:22px}
.pp small{font-size:12px;color:var(--mut)}
.pp .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pp .on small{color:var(--bg)}
.row[hidden]{display:none}
#ir,#lc{background:var(--tx);color:var(--bg)}
#lk{direction:ltr;text-align:left;font-size:12px}
#iml{max-height:38vh;overflow:auto;margin-top:8px}
.il{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.il b{flex:none;width:58px}
.il span{flex:none;color:var(--mut)}
.il em{overflow:hidden;font-style:normal;text-overflow:ellipsis;white-space:nowrap}
#tt{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:92vw;padding:10px 16px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#tt[hidden]{display:none}
#tb{border:0;background:none;color:var(--bg);font-size:14px;font-weight:800;text-decoration:underline}
</style>
</head>
<body>
<header>
 <div class="top"><h1 id="dt"></h1><div><button class="hb" id="gb">تنظیمات</button><button class="hb" id="ins" hidden>نصب برنامه</button></div></div>
 <div id="h"></div>
</header>
<div class="pw" id="wtw"><div class="seg" id="wt"></div></div>
<div class="days" id="days"></div>
<main id="list"></main>
<button id="add" aria-label="افزودن">+</button>
<nav><button data-v="day">روزانه</button><button data-v="week">هفتگی</button><button data-v="self">سلف</button></nav>

<div class="ov" id="ov" hidden><div class="sh" role="dialog" aria-modal="true">
 <div class="sh-h"><h2 id="st"></h2><button class="xb" aria-label="بستن">✕</button></div>
 <label>نام درس<input id="f-n"></label>
 <label>استاد<input id="f-t"></label>
 <span class="lb">روز</span><div class="chs" id="fd"></div>
 <div class="g2"><div><span class="lb">شروع</span><button class="tb" id="f-s"></button></div><div><span class="lb">پایان</span><button class="tb" id="f-e"></button></div></div>
 <span class="lb">برگزاری</span><div class="seg" id="fw"></div>
 <div class="g2"><label>شماره کلاس<input id="f-r" inputmode="numeric"></label><div><span class="lb">واحد</span><div class="stp"><button id="um">−</button><b id="uv"></b><button id="up2">+</button></div></div></div>
 <label>ساختمان<input id="f-b"></label><div class="chs" id="bq"></div>
 <div id="sw"></div>
 <label class="ck" id="ak"><input type="checkbox" id="f-a" checked><i></i>اعمال نام، استاد، واحد و رنگ روی همه‌ی جلسه‌های این درس</label>
 <p id="er"></p>
 <div class="ac"><button id="sv">ذخیره</button><button id="dl">حذف</button></div>
</div></div>

<div class="ov" id="ov2" hidden><div class="sh" role="dialog" aria-modal="true">
 <div class="sh-h"><h2 id="st2"></h2><button class="xb" aria-label="بستن">✕</button></div>
 <p class="rule" id="ru"></p>
 <div class="cal" id="cal"></div>
 <p id="pk"></p>
 <label>نام غذا (اختیاری)<input id="g-n" placeholder="مثلاً چلو مرغ"></label>
 <div class="pp" id="pp"></div>
 <p id="er2"></p>
 <div class="ac"><button id="sv2">ثبت سفارش</button><button id="dl2">حذف</button></div>
</div></div>

<div class="ov" id="os" hidden><div class="sh" role="dialog" aria-modal="true">
 <div class="sh-h"><h2>تنظیمات</h2><button class="xb" aria-label="بستن">✕</button></div>
 <span class="lb">این هفته، هفته‌ی فرد است یا زوج؟</span><div class="seg" id="sp"></div>
 <button class="row" id="su2" hidden>برگرداندن آخرین حالت</button>
 <span class="lb">اشتراک و پشتیبان</span>
 <button class="row" id="sl">اشتراک برنامه با لینک (برای هم‌کلاسی‌ها)</button>
 <button class="row" id="sb">ذخیره‌ی فایل پشتیبان</button>
 <button class="row" id="sr">بازیابی از فایل پشتیبان</button>
 <span class="lb">پاک‌سازی</span>
 <button class="row" id="sx">پاک‌کردن همه‌چیز (کلاس‌ها و سفارش‌های سلف)</button>
 <button class="row" id="sd">بازگردانی برنامه‌ی نمونه</button>
 <button class="row" id="su"></button>
</div></div>

<div class="ov" id="ol" hidden><div class="sh" role="dialog" aria-modal="true">
 <div class="sh-h"><h2>اشتراک برنامه</h2><button class="xb" aria-label="بستن">✕</button></div>
 <p class="rule">این لینک را توی گروه بفرست. هر کس بازش کند می‌تواند برنامه‌ی تو را وارد کند. فقط کلاس‌ها فرستاده می‌شود، نه سفارش‌های سلف.</p>
 <input id="lk" readonly>
 <div class="ac" style="margin-top:12px"><button id="lc">کپی لینک</button><button id="ls">ارسال…</button></div>
</div></div>
<div class="ov" id="im" hidden><div class="sh" role="dialog" aria-modal="true">
 <div class="sh-h"><h2>برنامه‌ی دریافتی</h2><button class="xb" aria-label="بستن">✕</button></div>
 <p class="rule" id="imn"></p>
 <div id="iml"></div>
 <div class="ac" style="margin-top:14px"><button id="ir">جایگزین برنامه‌ی من</button><button id="ia">اضافه به برنامه‌ام</button></div>
 <button class="row" id="ix">انصراف</button>
</div></div>
<div id="tt" hidden><span id="ttx"></span><button id="tb">برگرداندن</button></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<div class="ov mid" id="tp" hidden><div class="dlg">
 <div class="tpv" id="tv"></div>
 <span class="lb">ساعت</span><div class="gr" id="th"></div>
 <span class="lb">دقیقه</span><div class="gr" id="tn"></div>
 <div class="ac" style="margin-top:16px"><button id="tok">تأیید</button><button id="tno">انصراف</button></div>
</div></div>

<div class="ov mid" id="cf" hidden><div class="dlg">
 <p id="cm"></p>
 <div class="ac" style="margin-top:16px"><button id="cy"></button><button id="cn"></button></div>
</div></div>
<script>
const $=i=>document.getElementById(i),F=k=>$("f-"+k),fa=x=>String(x).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
const K=["#1d4ed8","#b45309","#0f766e","#be123c","#6d28d9","#4d7c0f","#64748b"],BL="ساختمان اسرار",VER=6;
// جلسه: d=روز (شنبه=۰)، s/e=دقیقه، w=هفته (۰ هر هفته، ۱ فرد، ۲ زوج)
const X=(d,s,e,n,t,r,u,c,w)=>({d,s:s*60,e:e*60,n,t,r,b:n?BL:"",u,c,w});
const PH=[X(0,8,10,"","","",0,6,2),X(2,8,10,"","","",0,6,2),X(3,10,12,"","","",0,6,2),X(5,8,10,"","","",0,6,2)];
const DEF=[X(0,8,12,"کاربینی (مدیریت مالی)","فرید آقاجانی","116",1,0,1),X(2,8,10,"مبانی سازمان و مدیریت (۱)","عطیه هوشیار","112",2,1,1),X(2,10,12,"مبانی سازمان و مدیریت (۱)","عطیه هوشیار","113",2,1,1),X(3,12,14,"ریاضیات و کاربرد آن در مدیریت (۱)","جواد آبسالان","116",2,2,1),X(4,12,14,"ریاضیات و کاربرد آن در مدیریت (۱)","جواد آبسالان","116",2,2,1),X(5,8,14,"اصول حسابداری (۱)","رضا واحدالعین","103",3,3,1),...PH];
const cp=a=>a.map(x=>({...x}));
